<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="t d">
<title id="t">BrandGuard review pipeline</title><desc id="d">Six connected stages from content submission to human approval.</desc>
<defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#A78BFA"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#38BDF8"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17152E"/><stop offset="1" stop-color="#101B32"/></linearGradient></defs>
<rect width="1000" height="260" rx="24" fill="#080914"/><path d="M95 119H905" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity=".65"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
<g><rect x="23" y="70" width="144" height="98" rx="15" fill="url(#node)" stroke="#8B5CF6"/><text x="95" y="112" fill="#F5F3FF" font-size="15" font-weight="700">Submit content</text><text x="95" y="137" fill="#A5A3C5" font-size="11">Text and assets</text></g>
<g><rect x="185" y="70" width="144" height="98" rx="15" fill="url(#node)" stroke="#8B5CF6"/><text x="257" y="112" fill="#F5F3FF" font-size="15" font-weight="700">Check rules</text><text x="257" y="137" fill="#A5A3C5" font-size="11">Deterministic checks</text></g>
<g><rect x="347" y="70" width="144" height="98" rx="15" fill="url(#node)" stroke="#6366F1"/><text x="419" y="112" fill="#F5F3FF" font-size="15" font-weight="700">Retrieve sources</text><text x="419" y="137" fill="#A5A3C5" font-size="11">Approved guidance</text></g>
<g><rect x="509" y="70" width="144" height="98" rx="15" fill="url(#node)" stroke="#6366F1"/><text x="581" y="112" fill="#F5F3FF" font-size="15" font-weight="700">Verify findings</text><text x="581" y="137" fill="#A5A3C5" font-size="11">Optional AI review</text></g>
<g><rect x="671" y="70" width="144" height="98" rx="15" fill="url(#node)" stroke="#38BDF8"/><text x="743" y="112" fill="#F5F3FF" font-size="15" font-weight="700">Human review</text><text x="743" y="137" fill="#A5A3C5" font-size="11">Decide each finding</text></g>
<g><rect x="833" y="70" width="144" height="98" rx="15" fill="url(#node)" stroke="#38BDF8"/><text x="905" y="112" fill="#F5F3FF" font-size="15" font-weight="700">Approve</text><text x="905" y="137" fill="#A5A3C5" font-size="11">Versioned record</text></g>
<text x="500" y="218" fill="#81809F" font-size="12">Evidence before suggestions · People before publication</text>
</g></svg>