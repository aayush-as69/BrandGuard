<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BrandGuard helps teams review content against approved brand guidelines, trace findings to evidence, and manage human approval.">
<meta name="theme-color" content="#080914">
<link rel="icon" type="image/svg+xml" href="/static/brandguard-mark.svg">
<title>BrandGuard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1><img class="brand-logo" src="/static/brandguard-mark.svg" width="28" height="28" alt="">BrandGuard</h1><span class="tag">Catch brand mistakes before they go live.</span>
  <nav id="nav" class="hidden">
    <button data-tab="content" class="on">Content</button>
    <button data-tab="kb">Knowledge base</button>
    <button data-tab="insights">Insights</button>
    <button data-tab="users" class="hidden">Users</button>
  </nav>
  <span class="sp"></span>
  <button class="btn tour-only" data-c="tourStart" aria-label="Take the guided tour">Tour</button>
  <label class="small muted" for="who">Role</label>
  <input type="password" id="pass" class="hidden" placeholder="Passcode" aria-label="Passcode" autocomplete="off">
  <select id="who" aria-label="Signed in as"></select>
  <a href="/login" id="hdr-signin" class="btn primary hidden" data-c="goLogin">Sign in</a>
  <span id="acct" class="acct hidden">
    <button class="btn acct-btn" id="acct-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acct-menu"><span id="acct-name"></span><span aria-hidden="true">▾</span></button>
    <div class="acct-menu hidden" id="acct-menu" role="menu">
      <div id="acct-role-row" class="hidden"><label for="demo-role" class="small muted">Switch demo role</label>
        <select id="demo-role" aria-label="Switch demo role">
          <option value="manager">Manager · Arjun</option><option value="reviewer">Reviewer · Meera</option>
          <option value="creator">Creator · Rahul</option><option value="agency">Agency writer · Neha</option></select></div>
      <button class="btn" id="chpw" type="button" role="menuitem">Change password</button>
      <button class="btn" id="mfa" type="button" role="menuitem">Two-step sign-in</button>
      <button class="btn" id="signout" type="button" role="menuitem">Sign out</button>
    </div></span>
</header>
<main id="main"></main>
<aside id="tour" class="hidden" role="dialog" aria-labelledby="tour-h" aria-live="polite">
  <div class="small muted" id="tour-n"></div><b id="tour-h"></b><p id="tour-t" class="small"></p>
  <div class="row"><button class="btn" id="tour-b" data-c="tourStep" data-a='[-1]'>Back</button>
   <button class="btn primary hidden" id="tour-do" data-c="tourDo">Do it for me</button>
   <button class="btn" id="tour-nx" data-c="tourStep" data-a='[1]'>Next</button>
   <button class="btn" data-c="tourClose" aria-label="Close the tour">Close</button></div>
</aside>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/landing.js"></script>
<script src="/static/js/users.js"></script>
<script src="/static/js/tour.js"></script>
<script src="/static/js/insights.js"></script>
<script src="/static/js/content.js"></script>
<script src="/static/js/kb.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
