<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandGuard</title>
<style>
  :root{--ink:#0f1b3d;--mute:#5b6478;--line:#d9deea;--bg:#f7f9fd;--card:#fff;--blue:#2563eb;--green:#16a34a;
        --amber:#d97706;--red:#dc2626;--purple:#7c3aed}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{margin:0;font-size:20px;color:var(--blue);letter-spacing:-.3px}
  header .tag{color:var(--green);font-weight:600;font-size:13px}
  header .sp{flex:1}
  nav button{background:none;border:0;padding:8px 12px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent}
  nav button.on{color:var(--ink);border-color:var(--blue);font-weight:600}
  select,input,textarea,button{font:inherit}
  select,input[type=text],textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
  textarea{resize:vertical}
  main{max-width:1280px;margin:0 auto;padding:20px 24px}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2,.card h3{margin:0 0 10px;font-size:15px}
  .muted{color:var(--mute)} .small{font-size:13px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .btn:hover{border-color:var(--blue)} .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.good{background:var(--green);border-color:var(--green);color:#fff}
  .btn.warn{background:#fff;border-color:var(--amber);color:var(--amber)}
  .btn.bad{background:#fff;border-color:var(--red);color:var(--red)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef2ff;color:var(--blue)}
  .chip.draft{background:#f1f5f9;color:#475569}.chip.in_review{background:#fff7ed;color:var(--amber)}
  .chip.changes_requested{background:#fef2f2;color:var(--red)}.chip.approved{background:#f0fdf4;color:var(--green)}
  .chip.high{background:#fef2f2;color:var(--red)}.chip.medium{background:#fff7ed;color:var(--amber)}.chip.low{background:#f1f5f9;color:#475569}
  .chip.ai{background:#f5f3ff;color:var(--purple)}
  .item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:8px;background:#fff}
  .item:hover{border-color:var(--blue)} .item.on{border-color:var(--blue);background:#eff4ff}
  .item b{display:block}
  .body{white-space:pre-wrap;line-height:1.75;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
  mark{border-radius:4px;padding:0 2px;cursor:pointer;color:inherit}
  mark.high{background:#fecaca} mark.medium{background:#fde68a} mark.low{background:#e2e8f0}
  mark.flash{outline:2px solid var(--blue)}
  .finding{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
  .finding.high{border-left-color:var(--red)} .finding.low{border-left-color:#94a3b8}
  .finding.done{opacity:.7;border-left-color:var(--green)}
  .finding.flash{box-shadow:0 0 0 2px var(--blue)}
  .quote{border-left:3px solid var(--blue);background:#f4f7ff;padding:6px 10px;margin:8px 0;font-size:13px;border-radius:0 6px 6px 0}
  .quote b{color:var(--blue)}
  .diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
  .diff del{background:#fecaca;text-decoration:line-through}.diff ins{background:#bbf7d0;text-decoration:none}
  table{width:100%;border-collapse:collapse;font-size:13px} td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .st-supported{color:var(--green);font-weight:600}.st-contradicted{color:var(--red);font-weight:600}.st-no_approved_source{color:var(--amber);font-weight:600}
  .cmt{border-bottom:1px solid var(--line);padding:8px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f1b3d;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw}
  .toast.err{background:var(--red)}
  .hidden{display:none}
  details summary{cursor:pointer;color:var(--mute)}
  .stack>*+*{margin-top:16px}
  .imgrow{display:grid;grid-template-columns:1.1fr 1.6fr .8fr .8fr auto;gap:6px;margin-bottom:6px}
  code{background:#eef2ff;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>BrandGuard</h1><span class="tag">Catch brand mistakes before they go live.</span>
  <nav id="nav" class="hidden">
    <button data-tab="content" class="on">Content</button>
    <button data-tab="kb">Knowledge base</button>
  </nav>
  <span class="sp"></span>
  <label class="small muted" for="who">Signed in as</label>
  <select id="who" style="width:auto"></select>
</header>
<main id="main"><p class="muted">Pick a user in the top right to begin. This demo uses synthetic data for a fictional brand, Brewline Coffee.</p></main>
<div id="toast" class="toast hidden"></div>

<script>
let ME=null, USERS=[], TAB='content', CUR=null, DETAIL=null, KBDATA=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=s=>({in_review:'In review',changes_requested:'Changes requested',draft:'Draft',approved:'Approved',no_approved_source:'No approved source'}[s]||s);

async function api(path,opt={}){
  const o={credentials:'same-origin',...opt};
  if(o.json!==undefined){o.method=o.method||'POST';o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(o.json);delete o.json}
  const r=await fetch(path,o); const t=await r.text(); let d={}; try{d=JSON.parse(t)}catch(e){}
  if(!r.ok) throw new Error(d.error||('Request failed ('+r.status+')'));
  return d;
}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='toast hidden',4200)}
async function run(fn){try{await fn()}catch(e){toast(e.message,true)}}

async function boot(){
  USERS=await api('/api/users');
  $('#who').innerHTML='<option value="">Choose…</option>'+USERS.map(u=>`<option value="${u.id}">${esc(u.name)} · ${u.role}${u.is_external?' (agency)':''}</option>`).join('');
  try{ME=await api('/api/me');$('#who').value=ME.id;afterLogin()}catch(e){}
}
$('#who').onchange=e=>run(async()=>{
  if(!e.target.value)return;
  ME=await api('/api/login',{json:{user_id:+e.target.value}});CUR=null;DETAIL=null;KBDATA=null;afterLogin()
});
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
function afterLogin(){$('#nav').classList.remove('hidden');render()}
function render(){TAB==='kb'?renderKB():renderContent()}

/* ------------------------------------------------------------ content list + detail */
async function renderContent(){
  const list=await api('/api/content');
  $('#main').innerHTML=`<div class="grid"><div class="stack">
    <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Content</h2>
      <button class="btn primary" onclick="showNew()">New</button></div><div style="margin-top:12px" id="list">
      ${list.length?list.map(c=>`<div class="item ${c.id===CUR?'on':''}" onclick="openContent(${c.id})">
        <b>${esc(c.title)}</b><span class="small muted">${esc(c.author)} · v${c.current_version}</span><br>
        <span class="chip ${c.status}">${label(c.status)}</span>
        ${c.open_findings?`<span class="chip high">${c.open_findings} open</span>`:`<span class="chip approved">${c.total_findings?'all decided':'clean'}</span>`}
      </div>`).join(''):'<p class="muted small">Nothing yet. Choose New to submit a draft for review.</p>'}</div></div></div>
    <div id="detail">${CUR?'':'<div class="card muted">Select content, or create new content to see findings with cited sources.</div>'}</div></div>`;
  if(CUR) await loadDetail(CUR);
}
async function openContent(id){CUR=id;await renderContent()}

function imgRow(i={}){return `<div class="imgrow">
  <input type="text" placeholder="file name" value="${esc(i.name||'')}" data-k="name">
  <input type="text" placeholder="alt text" value="${esc(i.alt||'')}" data-k="alt">
  <input type="text" placeholder="text colour #RRGGBB" value="${esc(i.text_color||'')}" data-k="text_color">
  <input type="text" placeholder="background #RRGGBB" value="${esc(i.bg_color||'')}" data-k="bg_color">
  <button class="btn" type="button" onclick="this.parentElement.remove()">×</button></div>`}
function readImgs(){return [...document.querySelectorAll('#imgs .imgrow')].map(r=>{const o={};r.querySelectorAll('input').forEach(i=>o[i.dataset.k]=i.value);return o}).filter(o=>o.name)}
function showNew(){
  CUR=null;DETAIL=null;
  $('#detail').innerHTML=`<div class="card stack"><h2>Submit content for review</h2>
   <div><label class="small muted">Title</label><input type="text" id="nt"></div>
   <div><label class="small muted">Text (paste an email, post or page)</label><textarea id="nb" rows="12"></textarea></div>
   <div><label class="small muted">Images (checked for alt text and text contrast)</label><div id="imgs"></div>
     <button class="btn small" type="button" onclick="document.getElementById('imgs').insertAdjacentHTML('beforeend',imgRow())">Add image</button></div>
   <div class="row"><button class="btn primary" onclick="createContent()">Review now</button>
     <button class="btn" onclick="loadDemo()">Load demo email</button></div></div>`;
}
async function loadDemo(){run(async()=>{const d=await api('/api/demo');$('#nt').value=d.title;$('#nb').value=d.body;
  $('#imgs').innerHTML=d.images.map(imgRow).join('')})}
async function createContent(){run(async()=>{
  const r=await api('/api/content',{json:{title:$('#nt').value,body:$('#nb').value,images:readImgs()}});
  CUR=r.id;toast('Reviewed. Findings are listed with their sources.');await renderContent()})}

async function loadDetail(id){
  DETAIL=await api('/api/content/'+id);
  const d=DETAIL,c=d.content,p=d.permissions,open=d.findings.filter(f=>f.decision==='open').length;
  const meta=d.review_meta||{};
  $('#detail').innerHTML=`<div class="stack">
   <div class="card"><div class="row" style="justify-content:space-between">
     <div><h2 style="margin:0;font-size:18px">${esc(c.title)}</h2>
       <span class="small muted">by ${esc(c.author)} · version ${c.current_version}</span></div>
     <div class="row"><span class="chip ${c.status}">${label(c.status)}</span>
       ${p.can_submit?`<button class="btn primary" onclick="act('submit')">Submit for approval</button>`:''}
       ${p.can_approve?`<button class="btn good" onclick="act('approve')">Approve</button>`:''}
       ${p.can_request_changes?`<button class="btn warn" onclick="reqChanges()">Request changes</button>`:''}
       ${p.can_rerun&&c.status!=='approved'?`<button class="btn" onclick="act('review')">Re-run review</button>`:''}</div></div>
     <p class="small muted" style="margin:8px 0 0">${open?`${open} finding${open>1?'s':''} still need a decision.`:(d.findings.length?'Every finding has a decision.':'No findings.')}
       Nothing is applied until a person clicks.</p>
     ${(meta.warnings||[]).map(w=>`<p class="small" style="color:var(--amber);margin:6px 0 0">⚠ ${esc(w)}</p>`).join('')}
     <p class="small muted" style="margin:6px 0 0">AI judge: ${esc(meta.llm_status||'not used')}${(meta.rejected||[]).length?` · ${(meta.rejected).length} unverifiable suggestion(s) discarded`:''}</p></div>
   <div class="grid" style="grid-template-columns:1fr 1.15fr">
     <div class="stack"><div class="card"><h3>Content</h3>
        <div class="body" id="body">${highlight(d)}</div>
        ${d.images.length?`<h3 style="margin-top:14px">Images</h3><table>${d.images.map(i=>`<tr><td><b>${esc(i.name)}</b></td>
          <td>alt: ${i.alt?esc(i.alt):'<span class="st-contradicted">missing</span>'}</td>
          <td>${i.text_color&&i.bg_color?`<span style="background:${esc(i.bg_color)};color:${esc(i.text_color)};padding:1px 8px;border-radius:4px">Aa</span> ${esc(i.text_color)} on ${esc(i.bg_color)}`:''}</td></tr>`).join('')}</table>`:''}
        ${p.can_revise?`<details style="margin-top:12px"><summary>Edit the text myself</summary>
          <textarea id="rb" rows="8" style="margin:8px 0">${esc(d.body)}</textarea>
          <button class="btn" onclick="revise()">Save as new version</button></details>`:''}</div>
        <div class="card"><h3>Claim check</h3>${d.claims.length?`<table>${d.claims.map(x=>`<tr>
          <td class="st-${x.status}">${label(x.status)}</td><td>${esc(x.text)}</td><td class="muted">${esc(x.source_id)}</td></tr>`).join('')}</table>`
          :'<p class="small muted">No promotional claims detected.</p>'}
          <p class="small muted" style="margin:8px 0 0">Claims are matched to approved facts. “No approved source” is never filled in by guessing.</p></div>
        <div class="card"><h3>Discussion</h3>${d.comments.map(m=>`<div class="cmt"><b>${esc(m.author)}</b> <span class="chip">${m.role}</span>
          <span class="small muted">${esc(m.created_at.slice(0,16).replace('T',' '))}</span><br>${esc(m.body)}</div>`).join('')||'<p class="small muted">No comments yet.</p>'}
          <div class="row" style="margin-top:10px"><input type="text" id="cm" placeholder="Add a comment…"><button class="btn" onclick="comment()">Post</button></div></div>
        <div class="card"><h3>Versions</h3>${d.versions.map(v=>`<div class="small"><b>v${v.version}</b> ${esc(v.author)} · ${esc(v.note)} <span class="muted">${esc(v.created_at.slice(0,16).replace('T',' '))}</span></div>`).join('')}
          ${d.audit.length?`<details style="margin-top:10px"><summary>Audit log (${d.audit.length})</summary>${d.audit.map(a=>`<div class="small muted">${esc(a.created_at.slice(0,16).replace('T',' '))} · ${esc(a.who||'system')} · <b>${esc(a.action)}</b> ${esc(a.detail)}</div>`).join('')}</details>`:''}</div></div>
     <div class="card"><h3>Findings (${d.findings.length})</h3>
        ${d.findings.map(f=>findingCard(f,p,c)).join('')||'<p class="muted small">Nothing to fix in this version.</p>'}
        ${d.history.length?`<details><summary>Resolved in earlier versions (${d.history.length})</summary>${d.history.map(h=>`<div class="small" style="padding:6px 0">
          <b>${esc(h.source_id)}</b> ${esc(h.span_text)} → <b>${esc(h.decision_text)}</b> <span class="muted">${h.decision} by ${esc(h.decided_by_name||'')}</span></div>`).join('')}</details>`:''}</div>
   </div></div>`;
}
function highlight(d){
  const spans=d.findings.filter(f=>f.target==='body'&&f.span_start>=0&&f.decision==='open').sort((a,b)=>a.span_start-b.span_start);
  let out='',pos=0;
  for(const f of spans){ if(f.span_start<pos)continue;
    out+=esc(d.body.slice(pos,f.span_start))+`<mark class="${f.severity}" onclick="jump(${f.id})" title="${esc(f.issue)}">${esc(d.body.slice(f.span_start,f.span_end))}</mark>`;pos=f.span_end}
  return out+esc(d.body.slice(pos));
}
function jump(id){const el=document.getElementById('f'+id);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400)}
function findingCard(f,p,c){
  const done=f.decision!=='open', fix=f.suggested_fix;
  const diff=f.target==='body'
    ? `<div class="diff"><del>${esc(f.span_text)}</del>${fix?` → <ins>${esc(fix)}</ins>`:' → <span class="muted">(no automatic suggestion)</span>'}</div>`
    : (fix?`<div class="diff"><ins>${esc(fix)}</ins> <span class="muted">${esc(f.fix_note)}</span></div>`:`<div class="small muted">${esc(f.fix_note)}</div>`);
  return `<div class="finding ${f.severity} ${done?'done':''}" id="f${f.id}">
    <div class="row"><span class="chip">${esc(f.category)}</span><span class="chip ${f.severity}">${f.severity} severity</span>
      <span class="chip">${f.confidence} confidence</span>${f.ai_generated?'<span class="chip ai">AI-generated</span>':''}
      ${f.needs_reviewer?'<span class="chip high">needs reviewer</span>':''}</div>
    <p style="margin:8px 0 4px"><b>${esc(f.issue)}</b></p>
    <div class="quote"><b>${f.source_type==='fact'?'Approved fact':'Guideline'} ${esc(f.source_id)}:</b> ${esc(f.source_quote)}</div>
    ${f.target==='body'?'<div class="small muted">Flagged text</div>':''}${diff}
    ${done?`<p class="small" style="margin:6px 0 0"><b>${f.decision}</b> by ${esc(f.decided_by_name||'')}${f.decision_reason?': '+esc(f.decision_reason):''}</p>`
    :(p.can_decide?`<div class="row" style="margin-top:8px">
        <button class="btn good" ${fix?'':'disabled title="No suggested fix. Use Edit."'} onclick="decide(${f.id},'accept')">Accept fix</button>
        <button class="btn" onclick="toggle('e${f.id}')">Edit</button>
        <button class="btn bad" onclick="toggle('d${f.id}')">Dismiss</button></div>
      <div id="e${f.id}" class="hidden row" style="margin-top:8px"><input type="text" id="et${f.id}" value="${esc(fix||(f.target==='body'?f.span_text:''))}" style="flex:1">
        <button class="btn primary" onclick="decide(${f.id},'edit',document.getElementById('et${f.id}').value)">Apply my edit</button></div>
      <div id="d${f.id}" class="hidden row" style="margin-top:8px"><input type="text" id="dr${f.id}" placeholder="Reason (required)" style="flex:1">
        <button class="btn bad" onclick="decide(${f.id},'dismiss',null,document.getElementById('dr${f.id}').value)">Dismiss with reason</button></div>`:'')}
  </div>`;
}
const toggle=id=>document.getElementById(id).classList.toggle('hidden');
function decide(id,action,text,reason){run(async()=>{
  const r=await api('/api/findings/'+id+'/decide',{json:{action,text,reason}});
  toast(action==='dismiss'?'Dismissed.':'Applied as version '+r.new_version+'. Content was re-reviewed.');await renderContent()})}
const act=(a)=>run(async()=>{await api('/api/content/'+CUR+'/'+a,{method:'POST',json:{}});
  toast({submit:'Submitted for approval.',approve:'Approved. This version is now locked.',review:'Review re-run.'}[a]);await renderContent()});
const reqChanges=()=>{const note=prompt('What needs to change?');if(note)run(async()=>{await api('/api/content/'+CUR+'/request-changes',{json:{note}});toast('Changes requested.');await renderContent()})};
const comment=()=>run(async()=>{const b=$('#cm').value;await api('/api/content/'+CUR+'/comments',{json:{body:b}});await renderContent()});
const revise=()=>run(async()=>{await api('/api/content/'+CUR+'/revise',{json:{body:$('#rb').value,images:DETAIL.images}});
  toast('Saved as a new version and re-reviewed.');await renderContent()});

/* ------------------------------------------------------------------ knowledge base */
async function renderKB(){
  let k;
  try{k=await api('/api/kb')}catch(e){$('#main').innerHTML=`<div class="card"><h2>Knowledge base</h2><p class="muted">${esc(e.message)}</p></div>`;return}
  const admin=ME.role==='admin';
  $('#main').innerHTML=`<div class="stack">
   ${admin?`<div class="card stack"><h2>Import (admin)</h2>
     <div class="row"><button class="btn primary" onclick="seed()">Load Brewline demo knowledge base</button>
       <span class="small muted">Replaces the current knowledge base with synthetic demo data.</span></div>
     <div class="row"><select id="ik" style="width:auto"><option value="guidelines">Guidelines (PDF, DOCX, TXT, MD)</option>
        <option value="facts">Approved facts (JSON)</option><option value="glossary">Glossary (JSON)</option>
        <option value="assets">Asset list (JSON)</option></select>
       <select id="il" style="width:auto"><option>internal</option><option>confidential</option><option>public</option></select>
       <input type="file" id="ifile"></div>
     <textarea id="itext" rows="3" placeholder="…or paste text / JSON here"></textarea>
     <div><button class="btn" onclick="doImport()">Import</button></div></div>`:''}
   <div class="card"><h2>Guidelines</h2>${k.guidelines.map(g=>`<p><b>${esc(g.title)}</b> <span class="chip">${g.access_level}</span></p>
     <table>${g.rules.map(r=>`<tr><td><code>${esc(r.code)}</code></td><td><b>${esc(r.title)}</b></td><td>${esc(r.text)}</td></tr>`).join('')}</table>`).join('')||'<p class="muted small">None visible to you.</p>'}</div>
   <div class="card"><h2>Approved facts</h2>${k.facts.length?`<table>${k.facts.map(f=>`<tr><td><code>${esc(f.code)}</code></td><td>${esc(f.kind)}</td><td>${esc(f.statement)}</td><td class="muted">${esc(f.source)} · ${f.access_level}</td></tr>`).join('')}</table>`:'<p class="muted small">None visible to you. Facts are confidential, so only managers, reviewers and admins can browse them.</p>'}</div>
   <div class="card"><h2>Glossary</h2><table>${k.glossary.map(g=>`<tr><td>${esc(g.kind)}</td><td>${esc(g.term)} → <b>${esc(g.preferred)}</b></td><td><code>${esc(g.rule_code)}</code></td></tr>`).join('')}</table></div>
   <div class="card"><h2>Reusable assets</h2><table>${k.assets.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.kind)}</td><td class="muted">${esc(a.note)}</td></tr>`).join('')}</table></div></div>`;
}
const seed=()=>run(async()=>{const r=await api('/api/kb/seed',{json:{}});toast('Demo knowledge base loaded: '+r.guidelines.rules+' rules, '+r.facts+' facts.');renderKB()});
const doImport=()=>run(async()=>{
  const fd=new FormData();fd.append('kind',$('#ik').value);fd.append('access_level',$('#il').value);fd.append('text',$('#itext').value);
  const f=$('#ifile').files[0];if(f)fd.append('file',f);
  const r=await api('/api/kb/import',{method:'POST',body:fd});toast('Imported: '+JSON.stringify(r));renderKB()});

boot();
</script>
