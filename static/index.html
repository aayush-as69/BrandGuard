<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BrandGuard checks content against approved brand guidelines and facts before it goes live, shows the evidence behind every finding, and keeps people in charge of approval.">
<meta name="theme-color" content="#0f1218">
<link rel="icon" type="image/svg+xml" href="/static/brandguard-mark.svg">
<title>BrandGuard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <button class="brand" type="button" data-c="brandHome" aria-label="BrandGuard home"><img src="/static/brandguard-mark.svg" width="26" height="26" alt="">BrandGuard</button><span class="tag">Catch brand mistakes before they go live.</span>
  <nav id="nav" class="hidden" aria-label="Main">
    <button type="button" data-tab="content" aria-current="page">Content</button>
    <button type="button" data-tab="kb">Knowledge base</button>
    <button type="button" data-tab="insights">Insights</button>
    <button type="button" data-tab="benchmark" class="hidden">Benchmark</button>
    <button type="button" data-tab="users" class="hidden">Users</button>
  </nav>
  <span class="sp"></span>
  <button class="btn tour-only" type="button" data-c="tourStart" aria-label="Take the guided tour">Tour</button>
  <label class="small muted" for="who">Role</label>
  <input type="password" id="pass" class="hidden" placeholder="Passcode" aria-label="Passcode" autocomplete="off">
  <select id="who" aria-label="Signed in as"></select>
  <a href="/login" id="hdr-signin" class="btn primary hidden" data-c="goLogin">Sign in</a>
  <span id="acct" class="acct hidden">
    <button class="btn acct-btn" id="acct-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="acct-menu"><span id="acct-name"></span><span aria-hidden="true">▾</span></button>
    <div class="acct-menu hidden" id="acct-menu" role="menu" aria-label="Account">
      <div id="acct-role-row" class="hidden field"><label for="demo-role">Switch demo role</label>
        <select id="demo-role" aria-label="Switch demo role">
          <option value="manager">Manager · Arjun</option><option value="reviewer">Reviewer · Meera</option>
          <option value="creator">Creator · Rahul</option><option value="agency">Agency writer · Neha</option></select></div>
      <button class="btn" id="chpw" type="button" role="menuitem">Change password</button>
      <button class="btn" id="mfa" type="button" role="menuitem">Two-step sign-in</button>
      <button class="btn" id="signout" type="button" role="menuitem">Sign out</button>
    </div></span>
</header>
<main id="main" tabindex="-1" aria-label="BrandGuard"></main>
<aside id="tour" class="hidden" role="dialog" aria-labelledby="tour-h" aria-live="polite">
  <div class="meta" id="tour-n"></div><b id="tour-h"></b><p id="tour-t" class="small"></p>
  <div class="row"><button class="btn" id="tour-b" type="button" data-c="tourStep" data-a='[-1]'>Back</button>
   <button class="btn primary hidden" id="tour-do" type="button" data-c="tourDo">Do it for me</button>
   <button class="btn" id="tour-nx" type="button" data-c="tourStep" data-a='[1]'>Next</button>
   <button class="btn" type="button" data-c="tourClose" aria-label="Close the tour">Close</button></div>
</aside>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/landing.js"></script>
<script src="/static/js/users.js"></script>
<script src="/static/js/tour.js"></script>
<script src="/static/js/insights.js"></script>
<script src="/static/js/content.js"></script>
<script src="/static/js/kb.js"></script>
<script src="/static/js/benchmark.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
