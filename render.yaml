# Render free-tier demo blueprint: no persistent disk, so the database is wiped whenever the service restarts or sleeps.
# Fine for a hackathon demo (sign in, press "Load demo knowledge base"); do not use for real content.
services:
  - type: web
    name: brandguard-demo
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - { key: BRANDGUARD_ENV, value: production }
      - { key: BRANDGUARD_AUTH, value: accounts }
      - { key: BRANDGUARD_TRUSTED_PROXIES, value: "1" }
      - { key: BRANDGUARD_SECRET, generateValue: true }
      - { key: BRANDGUARD_ADMIN_EMAIL, sync: false }
      - { key: BRANDGUARD_ADMIN_PASSWORD, sync: false }
      # AI judge through BharatCode (OpenAI-compatible). Paste your key from https://bharatcode.ai/account in the dashboard.
      - { key: BRANDGUARD_LLM_BASE_URL, value: "https://bharatcode.ai/api/model/v1" }
      - { key: BRANDGUARD_MODEL, value: qwen-3.8-27b }
      - { key: BRANDGUARD_LLM_REASONING, value: medium }
      - { key: BRANDGUARD_LLM_MAX_TOKENS, value: "8000" }  # reasoning counts toward the output limit
      - { key: BRANDGUARD_AI_TIMEOUT, value: "60" }          # medium reasoning is slower
      - { key: BRANDGUARD_LLM_API_KEY, sync: false }
      # To use Anthropic instead, remove the three lines above and set ANTHROPIC_API_KEY.
